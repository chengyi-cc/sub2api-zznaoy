name: Credential recovery storage
on:
  push:
    paths:
      - 'backend/internal/repository/credential_*.go'
      - 'backend/internal/service/credential_encryption*.go'
      - 'backend/internal/handler/admin/credential_encryption*.go'
      - '.github/workflows/credential-recovery.yml'
  pull_request:
    paths:
      - 'backend/internal/repository/credential_*.go'
      - 'backend/internal/service/credential_encryption*.go'
      - 'backend/internal/handler/admin/credential_encryption*.go'
      - '.github/workflows/credential-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: recovery-test-only
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Linux key persistence and recovery guards
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/repository ./internal/handler/admin -run 'TestCredentialEncryption|TestCredentialRecovery' -count=1
      - name: Real PostgreSQL cleanup and key persistence
        working-directory: backend
        env:
          SUB2API_RECOVERY_TEST_DSN: postgres://postgres:recovery-test-only@127.0.0.1:5432/recovery_test?sslmode=disable
        run: go test -tags integration ./internal/repository -run '^TestCredentialRecoveryPostgres$' -count=1 -v
